<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<title>タスク</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<style>
/* ============================================================
   デザイントークン
   ============================================================ */
:root {
  --brand:       #2FA39B;
  --brand-dark:  #23837C;
  --brand-light: #5CBCB5;
  --brand-tint:  rgba(47, 163, 155, 0.10);

  --bg:          #F7F5F2;
  --surface:     #FFFFFF;
  --border:      #E9E3DC;
  --text:        #2E2A26;
  --text-sub:    #7C736B;

  --danger:      #E05C4E;
  --danger-bg:   #FDEEEC;
  --danger-line: #F5C6C0;
  --warn:        #E89A3C;
  --accent:      #8B7CC8;

  --radius:      16px;
  --tap:         44px;

  --safe-top:    env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left:   env(safe-area-inset-left, 0px);
  --safe-right:  env(safe-area-inset-right, 0px);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
               "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif;
  font-size: 16px;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
  padding-left: var(--safe-left);
  padding-right: var(--safe-right);
  padding-bottom: calc(24px + var(--safe-bottom));
}

button, input, textarea, select {
  font-family: inherit;
  font-size: 16px;
  color: inherit;
}

button {
  cursor: pointer;
  border: none;
  background: none;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible {
  outline: 2px solid var(--brand);
  outline-offset: 2px;
}

/* ============================================================
   ヘッダー
   ============================================================ */
.app-header {
  background: var(--surface);
  color: var(--text);
  border-bottom: 1px solid var(--border);
  padding: calc(12px + var(--safe-top)) 16px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 20;
}

.app-header h1 {
  margin: 0;
  font-size: 19px;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--brand);
}

.reload-btn {
  min-width: var(--tap);
  min-height: var(--tap);
  color: var(--brand);
  font-size: 21px;
  border-radius: 999px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.reload-btn:active { background: var(--brand-tint); }
.reload-btn:disabled { opacity: 0.4; }

/* ============================================================
   メッセージ表示
   ============================================================ */
.message-area {
  position: sticky;
  top: 0;
  z-index: 30;
  padding: 0 16px;
}

.message {
  margin-top: 8px;
  padding: 12px 16px;
  border-radius: var(--radius);
  font-size: 15px;
  line-height: 1.5;
  background: var(--danger-bg);
  color: var(--danger);
  border: 1px solid var(--danger-line);
}

.message.is-info {
  background: var(--brand-tint);
  color: var(--brand-dark);
  border-color: var(--brand-light);
}

/* ============================================================
   追加フォーム
   ============================================================ */
.add-form {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 16px 18px;
}

.segmented {
  display: flex;
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 999px;
  overflow: hidden;
  background: var(--bg);
}

.segmented button {
  flex: 1 1 0;
  min-width: 0;
  min-height: var(--tap);
  font-size: 15px;
  font-weight: 500;
  color: var(--text-sub);
  padding: 0 4px;
  white-space: nowrap;
  border-radius: 999px;
}

.segmented button.is-active {
  background: var(--brand);
  color: #fff;
  font-weight: 700;
}

.name-row {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.name-row input {
  flex: 1 1 auto;
  min-width: 0;
  min-height: var(--tap);
  padding: 0 16px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: #fff;
}

.name-row input::placeholder { color: #B5ADA5; }

.add-btn {
  flex: 0 0 auto;
  min-height: var(--tap);
  padding: 0 22px;
  background: var(--brand);
  color: #fff;
  border-radius: 999px;
  font-weight: 700;
}

.add-btn:active { background: var(--brand-dark); }
.add-btn:disabled { opacity: 0.5; }

.detail-toggle {
  margin-top: 10px;
  min-height: 36px;
  color: var(--brand);
  font-size: 15px;
  font-weight: 600;
  padding: 0 2px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.detail-toggle .caret {
  font-size: 12px;
  transition: transform 0.15s ease;
}

.detail-toggle.is-open .caret { transform: rotate(90deg); }

.detail-panel { display: none; }
.detail-panel.is-open { display: block; }

.field { margin-top: 14px; }

.field label {
  display: block;
  font-size: 14px;
  color: var(--text-sub);
  margin-bottom: 6px;
}

.field input,
.field textarea {
  width: 100%;
  padding: 10px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: #fff;
}

.field input { min-height: var(--tap); }
.field textarea { min-height: 92px; resize: vertical; line-height: 1.6; }

/* ============================================================
   タブ・区分フィルタ
   ============================================================ */
.tabs {
  display: flex;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 10;
}

.tabs button {
  flex: 1 1 0;
  min-width: 0;
  min-height: var(--tap);
  font-size: 15px;
  font-weight: 500;
  color: var(--text-sub);
  padding: 0 2px;
  border-bottom: 3px solid transparent;
  white-space: nowrap;
}

.tabs button.is-active {
  color: var(--brand);
  font-weight: 700;
  border-bottom-color: var(--brand);
}

.filters {
  display: flex;
  padding: 12px 16px;
  gap: 8px;
  background: var(--bg);
}

.filters button {
  flex: 1 1 0;
  min-width: 0;
  min-height: 38px;
  font-size: 14px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: #fff;
  color: var(--text-sub);
  padding: 0 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.filters button.is-active {
  background: var(--brand);
  border-color: var(--brand);
  color: #fff;
  font-weight: 700;
}

/* ============================================================
   一覧
   ============================================================ */
.list { padding: 0 16px; }

.loading {
  padding: 32px 0;
  text-align: center;
  color: var(--text-sub);
  font-size: 15px;
}

.empty {
  padding: 52px 16px;
  text-align: center;
  color: var(--text-sub);
  font-size: 15px;
  line-height: 1.8;
}

.task {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 10px;
  overflow: hidden;
  position: relative;
  box-shadow: 0 1px 3px rgba(46, 42, 38, 0.05);
}

/* 区分「事業活動」の識別線 */
.task.is-jigyo::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
  background: var(--accent);
}

.task-main {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 14px 14px 16px;
}

.task-body {
  flex: 1 1 auto;
  min-width: 0;
  min-height: 32px;
  text-align: left;
  padding: 0;
}

.task-name {
  font-size: 16px;
  line-height: 1.5;
  word-break: break-word;
}

.task-meta {
  margin-top: 5px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text-sub);
}

.due.is-overdue { color: var(--danger); font-weight: 700; }
.due.is-today   { color: var(--warn);   font-weight: 700; }

.tag {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 1px 10px;
  font-size: 12px;
}

.memo-mark { color: var(--accent); }

/* 完了ボタン（行の右端） */
.done-btn {
  flex: 0 0 auto;
  align-self: center;
  min-height: var(--tap);
  padding: 0 16px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: #fff;
  color: var(--text-sub);
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
}

.done-btn:active {
  background: var(--brand);
  border-color: var(--brand);
  color: #fff;
}

.done-btn:disabled { opacity: 0.4; }

/* アコーディオン */
.task-detail {
  border-top: 1px solid var(--border);
  padding: 14px 16px 16px;
  background: #FCFBFA;
}

.memo-text {
  white-space: pre-wrap;
  word-break: break-word;
  font-size: 15px;
  line-height: 1.7;
  margin: 0 0 14px;
}

.memo-text.is-empty { color: var(--text-sub); }

.memo-edit {
  width: 100%;
  min-height: 110px;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: #fff;
  line-height: 1.6;
  resize: vertical;
  margin-bottom: 14px;
}

.detail-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.detail-actions button {
  min-height: var(--tap);
  padding: 0 20px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: #fff;
  font-size: 15px;
  font-weight: 600;
}

.detail-actions .primary {
  background: var(--brand);
  border-color: var(--brand);
  color: #fff;
}

.detail-actions .danger {
  color: var(--danger);
  border-color: var(--danger-line);
  margin-left: auto;
}

.detail-actions button:disabled { opacity: 0.5; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>

<header class="app-header">
  <h1>タスク</h1>
  <button class="reload-btn" id="reloadBtn" aria-label="再読み込み">⟳</button>
</header>

<div class="message-area" id="messageArea"></div>

<section class="add-form">
  <div class="segmented" id="kubunToggle" role="group" aria-label="区分">
    <button type="button" data-kubun="案件" class="is-active">案件</button>
    <button type="button" data-kubun="事業活動">事業活動</button>
  </div>

  <div class="name-row">
    <input type="text" id="nameInput" placeholder="タスク名を入力" autocomplete="off">
    <button type="button" class="add-btn" id="addBtn">追加</button>
  </div>

  <button type="button" class="detail-toggle" id="detailToggle" aria-expanded="false">
    <span class="caret">▶</span><span>詳細</span>
  </button>

  <div class="detail-panel" id="detailPanel">
    <div class="field">
      <label for="dueInput">期限日</label>
      <input type="date" id="dueInput">
    </div>
    <div class="field">
      <label for="tagInput">タグ</label>
      <input type="text" id="tagInput" placeholder="クライアント名・案件名など" autocomplete="off">
    </div>
    <div class="field">
      <label for="memoInput">メモ</label>
      <textarea id="memoInput" placeholder="詳細・備忘録"></textarea>
    </div>
  </div>
</section>

<nav class="tabs" id="tabs" role="tablist">
  <button type="button" data-tab="today" class="is-active">今日</button>
  <button type="button" data-tab="all">全部</button>
  <button type="button" data-tab="someday">いつか</button>
  <button type="button" data-tab="done">完了</button>
</nav>

<div class="filters" id="filters" role="group" aria-label="区分で絞り込み">
  <button type="button" data-kubun="all" class="is-active">全部</button>
  <button type="button" data-kubun="案件">案件</button>
  <button type="button" data-kubun="事業活動">事業活動</button>
</div>

<main class="list" id="list"></main>

<script>
/* ============================================================
   CONFIG : 設定値の一元管理
   ============================================================ */
const CONFIG = {
  // GAS ウェブアプリのURL（.../exec で終わるもの）
  GAS_URL: 'https://script.google.com/macros/s/AKfycbyAq0snmn_xk-O5S-PHdd98ly9ZGK8rVezMqjCMOid1Fz2RQjyiaIHSwJXlBaMX/exec',   // ※要確認

  // 設定シートの API_TOKEN と同じ値
  API_TOKEN: '93f640f90e9d4f5eaac80c5eadece324'  // ※要確認
};

/* ============================================================
   状態

   【取得方針】
   GAS Web App は1回の呼び出しに2〜15秒かかることが計測で判明したため、
   タブ・区分フィルタの切替では通信を行わない。
   起動時にアクティブタスクを全件取得して保持し、
   絞り込みと並べ替えはクライアント側で行う。
   完了ログは「完了」タブを最初に開いたときだけ取得する。
   ============================================================ */
const state = {
  tab: 'today',          // 'today' | 'all' | 'someday' | 'done'
  kubun: 'all',          // 'all' | '案件' | '事業活動'
  addKubun: '案件',      // 追加フォームで選択中の区分

  activeTasks: [],       // アクティブタスクの全件（サーバーから取得して保持）
  completedTasks: [],    // 完了ログ（同上）
  activeLoaded: false,   // アクティブタスクを取得済みか
  completedLoaded: false,// 完了ログを取得済みか

  expandedId: null,      // アコーディオンを開いているタスクID
  editingId: null,       // メモを編集中のタスクID
  loading: false,        // 一覧取得中フラグ
  busy: false            // 個別操作の実行中フラグ
};

/* 空状態のメッセージ（タブごと） */
const EMPTY_MESSAGE = {
  today:   '今日やるタスクはありません',
  all:     'タスクはありません',
  someday: '期限なしのタスクはありません',
  done:    '完了したタスクはありません'
};

/* DOM参照 */
const el = {
  messageArea:  document.getElementById('messageArea'),
  reloadBtn:    document.getElementById('reloadBtn'),
  kubunToggle:  document.getElementById('kubunToggle'),
  nameInput:    document.getElementById('nameInput'),
  addBtn:       document.getElementById('addBtn'),
  detailToggle: document.getElementById('detailToggle'),
  detailPanel:  document.getElementById('detailPanel'),
  dueInput:     document.getElementById('dueInput'),
  tagInput:     document.getElementById('tagInput'),
  memoInput:    document.getElementById('memoInput'),
  tabs:         document.getElementById('tabs'),
  filters:      document.getElementById('filters'),
  list:         document.getElementById('list')
};

let messageTimer = null;

/* ============================================================
   通信
   ============================================================ */

/**
 * GAS ウェブアプリへ POST する。
 * CORSのプリフライトを避けるため Content-Type は text/plain を使う。
 * @param {Object} payload token 以外のリクエスト内容
 * @return {Promise<Object>} {ok:true,...} または {ok:false, message:"..."}
 */
async function callApi(payload) {
  if (!CONFIG.GAS_URL || !CONFIG.API_TOKEN) {
    return { ok: false, message: 'CONFIG に GAS_URL と API_TOKEN を設定してください' };
  }

  try {
    const res = await fetch(CONFIG.GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ token: CONFIG.API_TOKEN }, payload))
    });
    return await res.json();
  } catch (err) {
    return { ok: false, message: '通信に失敗しました' };
  }
}

/* ============================================================
   メッセージ表示
   ============================================================ */

/**
 * 画面上部にメッセージを数秒間表示する。
 * @param {string} text 表示する文言
 * @param {string} type 'error'（既定）または 'info'
 */
function showMessage(text, type) {
  clearTimeout(messageTimer);
  el.messageArea.textContent = '';

  const box = document.createElement('div');
  box.className = 'message' + (type === 'info' ? ' is-info' : '');
  box.setAttribute('role', 'status');
  box.textContent = text;
  el.messageArea.appendChild(box);

  messageTimer = setTimeout(function () {
    el.messageArea.textContent = '';
  }, 4000);
}

/**
 * APIのエラー応答を処理する。
 * 「対象のタスクが見つかりません」の場合は一覧を再取得する。
 * @param {Object} res APIの応答
 */
function handleError(res) {
  const msg = res.message || 'エラーが発生しました';
  showMessage(msg);
  if (msg.indexOf('対象のタスクが見つかりません') !== -1) {
    fetchActive();
  }
}

/* ============================================================
   日付の判定
   ============================================================ */

/**
 * 本日の日付を 'yyyy/MM/dd' 形式で返す。
 * @return {string} 本日の日付文字列
 */
function todayString() {
  const d = new Date();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return d.getFullYear() + '/' + m + '/' + day;
}

/**
 * 期限日の状態を判定する。
 * @param {string} due 'yyyy/MM/dd' 形式の期限日
 * @return {string} 'overdue' | 'today' | 'future' | ''
 */
function dueStatus(due) {
  if (!due) return '';
  const today = todayString();
  if (due < today) return 'overdue';
  if (due === today) return 'today';
  return 'future';
}

/**
 * 'yyyy/MM/dd HH:mm' 形式の文字列を比較可能な数値に変換する。
 * 形式が想定外の場合は0を返す。
 * @param {string} str 日時文字列
 * @return {number} 比較用の数値
 */
function dateTimeValue(str) {
  if (!str) return 0;
  const num = String(str).replace(/[^0-9]/g, '');
  return num ? Number(num) : 0;
}

/* ============================================================
   データ取得（サーバー）
   ============================================================ */

/**
 * アクティブタスクを全件取得して保持する。
 * view と kubun の絞り込みはクライアント側で行うため、
 * サーバーへは常に view='all', kubun='all' で要求する。
 * @return {Promise<boolean>} 成功したらtrue
 */
async function fetchActive() {
  state.loading = true;
  renderList();

  const res = await callApi({ action: 'list', view: 'all', kubun: 'all' });
  state.loading = false;

  if (!res.ok) {
    state.activeTasks = [];
    state.activeLoaded = false;
    renderList();
    showMessage(res.message || 'エラーが発生しました');
    return false;
  }

  state.activeTasks = res.tasks || [];
  state.activeLoaded = true;
  renderList();
  return true;
}

/**
 * 完了ログを取得して保持する。
 * @return {Promise<boolean>} 成功したらtrue
 */
async function fetchCompleted() {
  state.loading = true;
  renderList();

  const res = await callApi({ action: 'listCompleted', kubun: 'all' });
  state.loading = false;

  if (!res.ok) {
    state.completedTasks = [];
    state.completedLoaded = false;
    renderList();
    showMessage(res.message || 'エラーが発生しました');
    return false;
  }

  state.completedTasks = res.tasks || [];
  state.completedLoaded = true;
  renderList();
  return true;
}

/**
 * 現在のタブに必要なデータが未取得なら取得する。
 * 取得済みなら通信せず、保持データをそのまま描画する。
 */
function ensureData() {
  if (state.tab === 'done') {
    if (!state.completedLoaded) {
      fetchCompleted();
      return;
    }
  } else {
    if (!state.activeLoaded) {
      fetchActive();
      return;
    }
  }
  renderList();
}

/**
 * 保持しているデータをすべて破棄して再取得する。
 * 更新ボタンと、追加・完了・削除の後に使う。
 */
async function reloadAll() {
  state.completedLoaded = false;
  state.completedTasks = [];

  if (state.tab === 'done') {
    await fetchCompleted();
    state.activeLoaded = false;
  } else {
    await fetchActive();
  }
}

/* ============================================================
   絞り込みと並べ替え（クライアント側）

   ※サーバー側 actionList_ / actionListCompleted_ と同一仕様。
     ビューを追加・変更する場合は両方の修正が必要。
   ============================================================ */

/**
 * 現在のタブと区分フィルタに従って、表示するタスク配列を組み立てる。
 * @return {Array<Object>} 表示対象のタスク配列
 */
function buildVisibleTasks() {
  const today = todayString();

  // 完了タブ：完了日時の降順（サーバー側で降順済みだが念のため）
  if (state.tab === 'done') {
    let logs = state.completedTasks.slice();
    if (state.kubun !== 'all') {
      logs = logs.filter(function (t) { return t.kubun === state.kubun; });
    }
    logs.sort(function (a, b) {
      return dateTimeValue(b.completedAt) - dateTimeValue(a.completedAt);
    });
    return logs;
  }

  // アクティブタスク
  let tasks = state.activeTasks.slice();

  if (state.kubun !== 'all') {
    tasks = tasks.filter(function (t) { return t.kubun === state.kubun; });
  }

  if (state.tab === 'today') {
    // 期限が本日以前のもののみ。期限なしは含めない。期限昇順
    tasks = tasks.filter(function (t) { return t.due && t.due <= today; });
    tasks.sort(function (a, b) {
      return a.due < b.due ? -1 : (a.due > b.due ? 1 : 0);
    });

  } else if (state.tab === 'someday') {
    // 期限が空欄のもののみ。登録日時の降順
    tasks = tasks.filter(function (t) { return !t.due; });
    tasks.sort(function (a, b) {
      return dateTimeValue(b.createdAt) - dateTimeValue(a.createdAt);
    });

  } else {
    // all : 期限昇順。期限なしは末尾（末尾内では登録日時の降順）
    tasks.sort(function (a, b) {
      if (!a.due && !b.due) {
        return dateTimeValue(b.createdAt) - dateTimeValue(a.createdAt);
      }
      if (!a.due) return 1;
      if (!b.due) return -1;
      return a.due < b.due ? -1 : (a.due > b.due ? 1 : 0);
    });
  }

  return tasks;
}

/* ============================================================
   描画
   ============================================================ */

/**
 * 一覧を描画する。
 * ユーザー入力は textContent で挿入し、innerHTML への代入は行わない。
 */
function renderList() {
  el.list.textContent = '';

  if (state.loading) {
    const box = document.createElement('div');
    box.className = 'loading';
    box.textContent = '読み込み中…';
    el.list.appendChild(box);
    return;
  }

  const tasks = buildVisibleTasks();

  if (tasks.length === 0) {
    const box = document.createElement('div');
    box.className = 'empty';
    box.textContent = EMPTY_MESSAGE[state.tab];
    el.list.appendChild(box);
    return;
  }

  tasks.forEach(function (task) {
    el.list.appendChild(buildTaskRow(task));
  });
}

/**
 * タスク1件分の行要素を生成する。
 * @param {Object} task タスクデータ
 * @return {HTMLElement} 行要素
 */
function buildTaskRow(task) {
  const isDone = (state.tab === 'done');

  const row = document.createElement('article');
  row.className = 'task' + (task.kubun === '事業活動' ? ' is-jigyo' : '');

  /* --- 上段（常時表示） --- */
  const main = document.createElement('div');
  main.className = 'task-main';

  // 本文（タップでアコーディオン開閉）
  const body = document.createElement('button');
  body.type = 'button';
  body.className = 'task-body';
  body.setAttribute('aria-expanded', String(state.expandedId === task.id));

  const nameEl = document.createElement('div');
  nameEl.className = 'task-name';
  nameEl.textContent = task.name;
  body.appendChild(nameEl);

  const meta = document.createElement('div');
  meta.className = 'task-meta';

  if (isDone) {
    // 完了タブでは完了日時を表示する
    if (task.completedAt) {
      const done = document.createElement('span');
      done.textContent = '完了 ' + task.completedAt;
      meta.appendChild(done);
    }
  } else if (task.due) {
    const due = document.createElement('span');
    const status = dueStatus(task.due);
    due.className = 'due' + (status === 'overdue' ? ' is-overdue'
                          : status === 'today'   ? ' is-today' : '');
    due.textContent = task.due;
    meta.appendChild(due);
  }

  if (task.tag) {
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = task.tag;
    meta.appendChild(tag);
  }

  if (task.memo) {
    const mark = document.createElement('span');
    mark.className = 'memo-mark';
    mark.textContent = '▸';
    mark.setAttribute('aria-label', 'メモあり');
    meta.appendChild(mark);
  }

  if (meta.childNodes.length > 0) {
    body.appendChild(meta);
  }

  body.addEventListener('click', function () {
    toggleExpand(task.id);
  });
  main.appendChild(body);

  // 完了ボタン（行の右端。完了タブでは表示しない）
  if (!isDone) {
    const doneBtn = document.createElement('button');
    doneBtn.type = 'button';
    doneBtn.className = 'done-btn';
    doneBtn.textContent = '完了';
    doneBtn.addEventListener('click', function (ev) {
      ev.stopPropagation();
      completeTask(task.id, doneBtn);
    });
    main.appendChild(doneBtn);
  }

  row.appendChild(main);

  /* --- 下段（アコーディオン） --- */
  if (state.expandedId === task.id) {
    row.appendChild(buildTaskDetail(task, isDone));
  }

  return row;
}

/**
 * アコーディオン部分（メモ表示・編集・削除）を生成する。
 * @param {Object} task タスクデータ
 * @param {boolean} isDone 完了タブかどうか
 * @return {HTMLElement} 詳細要素
 */
function buildTaskDetail(task, isDone) {
  const detail = document.createElement('div');
  detail.className = 'task-detail';

  // 編集中：textarea と保存・キャンセル
  if (state.editingId === task.id) {
    const textarea = document.createElement('textarea');
    textarea.className = 'memo-edit';
    textarea.value = task.memo || '';
    detail.appendChild(textarea);

    const actions = document.createElement('div');
    actions.className = 'detail-actions';

    const saveBtn = document.createElement('button');
    saveBtn.type = 'button';
    saveBtn.className = 'primary';
    saveBtn.textContent = '保存';
    saveBtn.addEventListener('click', function () {
      saveMemo(task.id, textarea.value, saveBtn);
    });

    const cancelBtn = document.createElement('button');
    cancelBtn.type = 'button';
    cancelBtn.textContent = 'キャンセル';
    cancelBtn.addEventListener('click', function () {
      state.editingId = null;
      renderList();
    });

    actions.appendChild(saveBtn);
    actions.appendChild(cancelBtn);
    detail.appendChild(actions);

    // 編集開始時にカーソルを末尾へ移動する
    setTimeout(function () {
      textarea.focus();
      textarea.setSelectionRange(textarea.value.length, textarea.value.length);
    }, 0);

    return detail;
  }

  // 通常表示：メモ本文
  const memo = document.createElement('p');
  memo.className = 'memo-text' + (task.memo ? '' : ' is-empty');
  memo.textContent = task.memo ? task.memo : 'メモなし';
  detail.appendChild(memo);

  // 完了タブでは編集・削除を出さない
  if (isDone) {
    return detail;
  }

  const actions = document.createElement('div');
  actions.className = 'detail-actions';

  const editBtn = document.createElement('button');
  editBtn.type = 'button';
  editBtn.textContent = '編集';
  editBtn.addEventListener('click', function () {
    state.editingId = task.id;
    renderList();
  });

  const deleteBtn = document.createElement('button');
  deleteBtn.type = 'button';
  deleteBtn.className = 'danger';
  deleteBtn.textContent = '削除';
  deleteBtn.addEventListener('click', function () {
    deleteTask(task, deleteBtn);
  });

  actions.appendChild(editBtn);
  actions.appendChild(deleteBtn);
  detail.appendChild(actions);

  return detail;
}

/**
 * アコーディオンの開閉を切り替える。
 * @param {string} id タスクID
 */
function toggleExpand(id) {
  if (state.expandedId === id) {
    state.expandedId = null;
  } else {
    state.expandedId = id;
  }
  state.editingId = null;
  renderList();
}

/* ============================================================
   操作
   ============================================================ */

/**
 * タスクを追加する。
 * 追加後はアクティブタスクを再取得する
 * （サーバーが採番したIDと登録日時を正確に保持するため）。
 */
async function addTask() {
  const name = el.nameInput.value.trim();

  if (!name) {
    showMessage('タスク名を入力してください');
    el.nameInput.focus();
    return;
  }
  if (state.busy) return;

  state.busy = true;
  el.addBtn.disabled = true;
  el.addBtn.textContent = '追加中';

  const res = await callApi({
    action: 'add',
    name: name,
    kubun: state.addKubun,
    due: el.dueInput.value,
    tag: el.tagInput.value.trim(),
    memo: el.memoInput.value
  });

  state.busy = false;
  el.addBtn.disabled = false;
  el.addBtn.textContent = '追加';

  if (!res.ok) {
    handleError(res);
    return;
  }

  // 入力欄をクリアし、詳細を折りたたむ。区分の選択は維持する。
  el.nameInput.value = '';
  el.dueInput.value = '';
  el.tagInput.value = '';
  el.memoInput.value = '';
  setDetailOpen(false);

  showMessage('追加しました', 'info');
  fetchActive();
}

/**
 * タスクを完了にする。確認は挟まない。
 * 保持データから該当タスクを取り除くだけで、再取得は行わない
 * （通信を1回に抑えるため）。完了ログは未取得状態に戻す。
 * @param {string} id タスクID
 * @param {HTMLElement} btn 押されたボタン
 */
async function completeTask(id, btn) {
  if (state.busy) return;

  state.busy = true;
  btn.disabled = true;
  btn.textContent = '…';

  const res = await callApi({ action: 'complete', id: id });

  state.busy = false;
  btn.disabled = false;
  btn.textContent = '完了';

  if (!res.ok) {
    handleError(res);
    return;
  }

  state.activeTasks = state.activeTasks.filter(function (t) { return t.id !== id; });
  state.completedLoaded = false;  // 完了ログは次に開いたとき取り直す

  if (state.expandedId === id) {
    state.expandedId = null;
    state.editingId = null;
  }
  renderList();
  showMessage('完了しました', 'info');
}

/**
 * タスクを削除する。完了ログには残らない。
 * @param {Object} task タスクデータ
 * @param {HTMLElement} btn 押されたボタン
 */
async function deleteTask(task, btn) {
  if (state.busy) return;
  if (!window.confirm('「' + task.name + '」を削除します。\n完了記録には残りません。よろしいですか？')) {
    return;
  }

  state.busy = true;
  btn.disabled = true;

  const res = await callApi({ action: 'delete', id: task.id });

  state.busy = false;
  btn.disabled = false;

  if (!res.ok) {
    handleError(res);
    return;
  }

  state.activeTasks = state.activeTasks.filter(function (t) { return t.id !== task.id; });
  state.expandedId = null;
  state.editingId = null;
  renderList();
  showMessage('削除しました', 'info');
}

/**
 * メモを保存する。
 * @param {string} id タスクID
 * @param {string} memo 保存するメモ本文
 * @param {HTMLElement} btn 押されたボタン
 */
async function saveMemo(id, memo, btn) {
  if (state.busy) return;

  state.busy = true;
  btn.disabled = true;
  btn.textContent = '保存中';

  const res = await callApi({ action: 'updateMemo', id: id, memo: memo });

  state.busy = false;
  btn.disabled = false;
  btn.textContent = '保存';

  if (!res.ok) {
    handleError(res);
    return;
  }

  // 保持データを更新して再描画する
  state.activeTasks = state.activeTasks.map(function (t) {
    if (t.id === id) { t.memo = memo; }
    return t;
  });
  state.editingId = null;
  renderList();
  showMessage('メモを保存しました', 'info');
}

/* ============================================================
   UI操作
   ============================================================ */

/**
 * 追加フォームの詳細パネルを開閉する。
 * @param {boolean} open 開くならtrue
 */
function setDetailOpen(open) {
  el.detailPanel.classList.toggle('is-open', open);
  el.detailToggle.classList.toggle('is-open', open);
  el.detailToggle.setAttribute('aria-expanded', String(open));
}

/**
 * ボタン群の選択状態を切り替える。
 * @param {HTMLElement} container ボタンの親要素
 * @param {HTMLElement} target 選択されたボタン
 */
function setActive(container, target) {
  Array.prototype.forEach.call(container.children, function (btn) {
    btn.classList.toggle('is-active', btn === target);
  });
}

/* ============================================================
   イベント登録
   ============================================================ */

// 区分トグル（追加フォーム）
el.kubunToggle.addEventListener('click', function (ev) {
  const btn = ev.target.closest('button');
  if (!btn) return;
  state.addKubun = btn.dataset.kubun;
  setActive(el.kubunToggle, btn);
});

// 追加ボタン
el.addBtn.addEventListener('click', addTask);

// タスク名入力欄で Enter を押したら追加する
el.nameInput.addEventListener('keydown', function (ev) {
  if (ev.key === 'Enter') {
    ev.preventDefault();
    addTask();
  }
});

// 詳細トグル
el.detailToggle.addEventListener('click', function () {
  setDetailOpen(!el.detailPanel.classList.contains('is-open'));
});

// タブ切替（通信は「完了」タブの初回のみ）
el.tabs.addEventListener('click', function (ev) {
  const btn = ev.target.closest('button');
  if (!btn) return;
  if (state.tab === btn.dataset.tab) return;

  state.tab = btn.dataset.tab;
  state.expandedId = null;
  state.editingId = null;
  setActive(el.tabs, btn);
  ensureData();
});

// 区分フィルタ切替（通信なし）
el.filters.addEventListener('click', function (ev) {
  const btn = ev.target.closest('button');
  if (!btn) return;
  if (state.kubun === btn.dataset.kubun) return;

  state.kubun = btn.dataset.kubun;
  state.expandedId = null;
  state.editingId = null;
  setActive(el.filters, btn);
  renderList();
});

// 再読み込み（明示的に取り直す）
el.reloadBtn.addEventListener('click', async function () {
  if (state.loading || state.busy) return;
  state.expandedId = null;
  state.editingId = null;
  el.reloadBtn.disabled = true;
  await reloadAll();
  el.reloadBtn.disabled = false;
});

// 初期表示
fetchActive();
</script>
